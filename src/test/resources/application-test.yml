spring:
  datasource:
    url: jdbc:h2:mem:testdb-${random.uuid};DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 25
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

library:
  loan:
    max-active-loans-per-member: 3
    loan-duration-days: 14
